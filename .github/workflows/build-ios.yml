name: Build iOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned IPA
        run: |
          cd ios
          # List .xcworkspace directory name (not its contents) — needs -d on BSD ls
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "Workspace: $WORKSPACE"

          # Extract first scheme name using awk (BSD sed syntax differs from GNU)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print $1;exit}')
          echo "Scheme: $SCHEME"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No scheme found. Listing workspace contents:"
            xcodebuild -workspace "$WORKSPACE" -list
            exit 1
          fi

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r ../App-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABC-Hijack-PoC-IPA
          path: App-unsigned.ipa
          retention-days: 30
